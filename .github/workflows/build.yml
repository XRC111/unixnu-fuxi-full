name: Build

# Builds the fuxi boot image from this repository's tree.
#
# The tree is the reference port's, with this unit's two device-specific values: the unixnu window is the
# 32 GiB carve at LBA 53461760..61850367 rather than the whole stock userdata partition, and the Data
# volume UUID matches what make-data-seed.py derives for a 5 GiB seed.
#
# The packaging rules come from AGENTS.md and are not optional:
#   - the payload takes --owner-trust-cache (a bundle carrying the AdrenoMetal plugin CDHashes) and
#     --gpu-addon, not --trust-cache alone;
#   - the boot image is made by uefi-fuxi/scripts/bootimage.py, never by `unixnu bootimg`;
#   - four checks decide whether the result is deliverable:
#     payload.json trust_cache_sha256, payload.json gpu_addon_sha256, the trustcache inside the payload
#     image, and header_version 3 in bootimage.json.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      unixnu_ref:
        description: OddlyLabs/UniXNU ref
        default: 6ae4c252937ae1920ab68eaded10fc78447e0194
      uefi_ref:
        description: OddlyLabs/uefi-fuxi ref
        default: c5793bc2c60a2e2f5d9fbaad8717ed3f2736bfd2

concurrency:
  group: build-main
  cancel-in-progress: false

# Read access to the repository is all the build needs, but the token also has to be usable against the
# public GitHub API: prepare-xnu-source.py reads DriverKit headers from a pinned Apple tag, and without a
# token the request goes out anonymous and hits the per-address quota.
permissions:
  contents: read

env:
  UNIXNU_REPO: OddlyLabs/UniXNU
  # github.event.inputs, not inputs: the inputs context is only defined for a workflow_dispatch run, and a
  # push trigger made the whole file invalid when it was referenced at top level.
  UNIXNU_REF: ${{ github.event.inputs.unixnu_ref || '6ae4c252937ae1920ab68eaded10fc78447e0194' }}
  UEFI_REPO: OddlyLabs/uefi-fuxi
  UEFI_REF: ${{ github.event.inputs.uefi_ref || 'c5793bc2c60a2e2f5d9fbaad8717ed3f2736bfd2' }}
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALL_CLEANUP: 1
  HOMEBREW_NO_ENV_HINTS: 1
  MTOOLS_SKIP_CHECK: 1

jobs:
  image:
    name: fuxi boot image
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
        with:
          path: fuxi
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UNIXNU_REPO }}
          ref: ${{ env.UNIXNU_REF }}
          path: unixnu
          # recursive: Adreno740, GopFramebuffer, AdrenoFirmware, AdrenoPM4, ArmSmmu4K and XnuPrelink are
          # submodules of the fork, and the archive steps read them directly. Without this the tree has
          # empty directories where sixteen builders expect sources.
          submodules: recursive
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.UEFI_REPO }}
          ref: ${{ env.UEFI_REF }}
          path: uefi-fuxi
          # Not recursive: this repository's submodules include microsoft/mu_plus, mu_basecore and
          # openssl/openssl, which together dwarf what the firmware build needs, and pulling them made the
          # checkout step stall for minutes. board.toml [firmware] submodules names the four the build
          # actually reads, and the firmware step fetches those itself.
          submodules: false
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Select Xcode
        run: |
          dir=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -n 1)
          [ -n "$dir" ] || { echo "::error::no Xcode 26 on this image"; exit 1; }
          echo "DEVELOPER_DIR=$dir/Contents/Developer" >> "$GITHUB_ENV"
          "$dir/Contents/Developer/usr/bin/xcodebuild" -version
      - name: Install host tools
        run: |
          brew install llvm lld mtools dtc openssl@3
          if ! command -v unifdef >/dev/null; then
            brew install unifdef
            echo "$(brew --prefix unifdef)/bin" >> "$GITHUB_PATH"
          fi
          # The Data seed formats an APFS container on this Mac; name a missing tool here rather than in a
          # subprocess three steps later.
          for tool in hdiutil newfs_apfs diskutil dd mdir; do
            command -v "$tool" >/dev/null || { echo "::error::missing $tool"; exit 1; }
          done
      - name: Select the device
        working-directory: unixnu
        run: ./unixnu defconfig fuxi_full_defconfig --device "$GITHUB_WORKSPACE/fuxi"
      - name: Fetch the OS and SystemOS windows
        working-directory: unixnu
        run: ./unixnu fetch OS "Cryptex1,SystemOS" --device "$GITHUB_WORKSPACE/fuxi"
      - name: Name the prelink kit the way the builders expect
        working-directory: unixnu
        run: |
          # UniXNU declares kits/XnuPrelink; the reference port's thirty-four builders import
          # kits/NativePrelink. A symlink gives both names one checkout instead of two copies that can drift,
          # and it leaves every script byte-identical to the tree it came from.
          out=$(./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          tree="$out/tree"
          if [ -d "$tree/kits/XnuPrelink" ] && [ ! -e "$tree/kits/NativePrelink" ]; then
            ln -s XnuPrelink "$tree/kits/NativePrelink"
            echo "linked kits/NativePrelink -> XnuPrelink"
          fi
          ls -l "$tree/kits" | head -n 20
      - name: Build the VerifiedRoot policies
        working-directory: unixnu
        run: |
          # archive-11 (build-verified-root-probe.py) reads build/verified-root-os/verification.json, and
          # nothing in the archive list creates it: build-fuxi-verified-root-policy.py signs the two
          # unchanged IPSW disk images and emits both policies plus the probe archive. Its default --ipsw-dir
          # resolves to out/<device>/ipsw/21H461, which the fetch step above populated.
          out=$(./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          python3 "$out/tree/scripts/build-fuxi-verified-root-policy.py" --ipsw-dir "$out/ipsw/21H461"
          ls -l "$out/tree/build/verified-root-os" "$out/tree/build/verified-root-systemos"

      - name: Build kernel
        working-directory: unixnu
        # GITHUB_TOKEN reaches prepare-xnu-source.py, which restores the DriverKit headers newer xnu omits
        # by reading them from a pinned Apple tag. Anonymous API calls share a small per-address quota that
        # hosted runners exhaust, and the failure is an HTTP 403 in the middle of the bootstrap pass.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./unixnu build kernel --device "$GITHUB_WORKSPACE/fuxi"
      - name: Make the Data seed
        working-directory: unixnu
        run: |
          # 5 GiB: the 32 GiB window holds the 8.81 GiB root image, the store header and bitmap, a
          # 1024-block guard and the 1 GiB log reserve, which leaves 6.19 GiB.
          python3 "$GITHUB_WORKSPACE/fuxi/scripts/make-data-seed.py" --gib 5 \
            --output "$RUNNER_TEMP/data-seed.dbr" --report "$RUNNER_TEMP/data-seed.json"
          cat "$RUNNER_TEMP/data-seed.json"
          echo "UNIXNU_DATA_RAMDISK=$RUNNER_TEMP/data-seed.dbr" >> "$GITHUB_ENV"
      - name: Fetch the restore ramdisk and the trust caches
        working-directory: unixnu
        run: |
          ./unixnu ipsw fetch RestoreRamDisk RestoreTrustCache --device "$GITHUB_WORKSPACE/fuxi"
          ramdisk=$(ls out/ipsw/*/*.dmg | head -n 1)
          [ -n "$ramdisk" ] || { echo "::error::restore ramdisk missing"; exit 1; }
          trust=$(ls out/ipsw/*/*.dmg.trustcache | head -n 1)
          [ -n "$trust" ] || { echo "::error::restore trust cache missing"; exit 1; }
          echo "UNIXNU_RESTORE_RAMDISK=$ramdisk" >> "$GITHUB_ENV"
          echo "UNIXNU_RESTORE_TRUST=$trust" >> "$GITHUB_ENV"
      - name: Build the GPU addon
        working-directory: unixnu
        run: |
          # AGENTS.md requires --gpu-addon on the payload: the kernel writes this file into the Data volume at
          # boot, and without it the Metal plugin has nothing to load.
          python3 scripts/make-gpu-addon.py --device "$GITHUB_WORKSPACE/fuxi" \
            --output "$RUNNER_TEMP/fuxi-gpu-addon.ngpu"
          ls -l "$RUNNER_TEMP/fuxi-gpu-addon.ngpu"
          echo "UNIXNU_GPU_ADDON=$RUNNER_TEMP/fuxi-gpu-addon.ngpu" >> "$GITHUB_ENV"
      - name: Build the owner trust bundle
        working-directory: unixnu
        run: |
          # The original two Apple modules alone leave the AdrenoMetal plugin untrusted, and AMFI then stops
          # the boot at the logo. make-owner-trust-bundle.py adds the plugin CDHashes to a bundle that keeps
          # the original modules unchanged, which is what --owner-trust-cache has to receive.
          out=$(./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          bundle="$out/tree/build/adreno-metal-plugin/owner-trust.bundle"
          mkdir -p "$(dirname "$bundle")"
          base=$(find "$out" -name 'original-static-system.bundle' | head -n 1)
          [ -n "$base" ] || { echo "::error::original trust bundle missing; build the payload once first"; exit 1; }
          cp "$base" "$(dirname "$bundle")/original-static-system.bundle"
          ( cd "$out/tree" && python3 scripts/make-owner-trust-bundle.py )
          [ -f "$bundle" ] || { echo "::error::owner trust bundle was not produced"; exit 1; }
          echo "UNIXNU_OWNER_TRUST=$bundle" >> "$GITHUB_ENV"
      - name: Build payload
        working-directory: unixnu
        run: |
          ./unixnu build payload --device "$GITHUB_WORKSPACE/fuxi" --uefi "$GITHUB_WORKSPACE/uefi-fuxi" \
            --unique-chip-id "$BRINGUP_SEED" \
            --owner-trust-cache "$UNIXNU_OWNER_TRUST" \
            --data-ramdisk "$UNIXNU_DATA_RAMDISK" \
            --gpu-addon "$UNIXNU_GPU_ADDON" \
            --skip-setup
          report=$(find out -path '*/payload/payload.json' | head -n 1)
          cat "$report"
          echo "UNIXNU_PAYLOAD_REPORT=$report" >> "$GITHUB_ENV"
        env:
          # Quoted: unquoted 0x0123456789abcdef is parsed as a 64-bit YAML integer, and the value overflows
          # that type, which makes the whole workflow file invalid before any job is created.
          BRINGUP_SEED: "0x0123456789abcdef"
      - name: Build firmware
        working-directory: unixnu
        run: ./unixnu build firmware --device "$GITHUB_WORKSPACE/fuxi" --uefi "$GITHUB_WORKSPACE/uefi-fuxi" --target DEBUG
      - name: Pack the boot image
        run: |
          # bootimage.py, not `unixnu bootimg`: the rules require header_version 3, and this is the generator
          # that writes it.
          out=$(cd unixnu && ./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          mkdir -p "$RUNNER_TEMP/image"
          python3 uefi-fuxi/scripts/bootimage.py \
            --ramdisk "$out/payload/payload.img" \
            -o "$RUNNER_TEMP/image/boot.img"
          cat "$out/boot/bootimage.json" 2>/dev/null || true
          ls -l "$RUNNER_TEMP/image/boot.img"
      - name: Check the deliverable
        run: |
          set -e
          out=$(cd unixnu && ./unixnu status --json | python3 -c 'import json,sys; print(json.load(sys.stdin)["output"])')
          python3 "$GITHUB_WORKSPACE/fuxi/scripts/check-deliverable.py" \
            "$out/payload/payload.json" "$out/payload/payload.img" "$out/boot/bootimage.json"
      - name: Encrypt the boot image
        run: |
          openssl="$(brew --prefix openssl@3)/bin/openssl"
          kernel=$(find unixnu/out -path '*/kernel/kernel.macho' | head -n 1)
          report=$(find unixnu/out -path '*/payload/payload.json' | head -n 1)
          [ -n "$kernel" ] && [ -n "$report" ] || { echo "::error::kernel or payload.json missing"; exit 1; }
          cd "$RUNNER_TEMP/image"
          gzip -9 -n -c "$GITHUB_WORKSPACE/$kernel" > kernel.macho.gz
          cp "$GITHUB_WORKSPACE/$report" payload.json
          for f in boot.img kernel.macho.gz; do shasum -a 256 "$f" | sed "s#  .*#  $f#" > "$f.sha256"; done
          "$openssl" rand -hex 32 > boot.key
          for f in boot.img kernel.macho.gz; do
            "$openssl" enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -in "$f" -out "$f.enc" -pass file:boot.key
          done
          "$openssl" pkeyutl -encrypt -pubin -inkey "$GITHUB_WORKSPACE/fuxi/ci/boot-image-recipient.pem" \
            -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 -in boot.key -out boot.key.enc
          rm -f boot.key boot.img kernel.macho.gz
          mkdir -p "$RUNNER_TEMP/encrypted"
          mv boot.img.enc kernel.macho.gz.enc boot.key.enc boot.img.sha256 kernel.macho.gz.sha256 payload.json \
            "$RUNNER_TEMP/encrypted/"
      - uses: actions/upload-artifact@v4
        with:
          name: fuxi-boot-image-encrypted-${{ github.run_attempt }}
          path: ${{ runner.temp }}/encrypted
          if-no-files-found: error
      - name: Collect the text logs
        if: always()
        run: |
          mkdir -p "$RUNNER_TEMP/logs"
          find unixnu/out -path '*/logs/*.log' -size -20M -exec cp {} "$RUNNER_TEMP/logs/" \; 2>/dev/null || true
          cp "$RUNNER_TEMP/payload-list.txt" "$RUNNER_TEMP/logs/" 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fuxi-build-logs-${{ github.run_attempt }}
          path: ${{ runner.temp }}/logs
          if-no-files-found: warn
